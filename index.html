<style>
:root{
  --ink:#151a20;
  --body:#4d5764;
  --soft:#7b8593;
  --line:#e3e0d9;
  --rule:#cfcabf;
  --bg:#ffffff;
  --panel:#f7f5f1;
  --panel2:#efece5;
  --accent:#8a6a3c;
  --accent-soft:#f0e8da;
  --teal:#1f4e5c;
  --teal-soft:#dfeaed;
  --font:"Segoe UI","Dubai",Tahoma,Arial,"Helvetica Neue",sans-serif;
  --pad:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{
  background:var(--panel2);
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ---------- deck / slide shell ---------- */
.deck{
  height:100vh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  padding-bottom:76px;
}
.slide{
  scroll-snap-align:start;
  scroll-margin-top:0;
  min-height:100vh;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:var(--pad) var(--pad) 84px;
  display:flex;
  flex-direction:column;
  gap:22px;
}
.slide > .grow{flex:1;min-height:0}
.slide > .grid.grow{align-content:center}
.slide > .split.grow{align-items:center}
.slide > .tablewrap.grow{display:flex;flex-direction:column;justify-content:center}

/* ---------- typography ---------- */
.eyebrow{
  font-size:11px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
  display:flex;
  align-items:center;
  gap:10px;
}
.eyebrow:after{content:"";flex:1;height:1px;background:var(--line);max-width:180px}
h1{font-size:clamp(30px,3.4vw,42px);line-height:1.22;font-weight:600;letter-spacing:-.01em;max-width:22ch}
html[lang=en] h1{max-width:26ch}
h2{font-size:clamp(21px,2.3vw,28px);line-height:1.3;font-weight:600;letter-spacing:-.005em;max-width:34ch}
html[lang=en] h2{max-width:42ch}
h3{font-size:13px;font-weight:700;letter-spacing:.03em;color:var(--ink);margin-bottom:10px}
p,li{color:var(--body)}
.lead{font-size:17px;line-height:1.62;color:var(--ink);max-width:62ch;font-weight:400}
.sub{font-size:14px;color:var(--soft);max-width:70ch}
.note{font-size:11.5px;line-height:1.55;color:var(--soft)}
.note b{color:var(--body);font-weight:600}
strong,b{color:var(--ink);font-weight:600}

/* ---------- layout ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.split{display:grid;grid-template-columns:1.32fr .68fr;gap:30px;align-items:start}

/* Force Latin-numeral runs to stay left-to-right inside RTL copy */
.ltr{direction:ltr;unicode-bidi:isolate}
html[dir=rtl] td.ltr,html[dir=rtl] .kpi .num.ltr{text-align:right}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px 20px}
.panel.plain{background:transparent;border:0;border-top:2px solid var(--ink);border-radius:0;padding:14px 0 0}
.panel.mark{background:var(--accent-soft);border-color:#e3d5bd}
.panel.teal{background:var(--teal-soft);border-color:#c8dbe0}

ul.list{list-style:none;display:flex;flex-direction:column;gap:9px}
ul.list li{padding-inline-start:16px;position:relative;font-size:14px;line-height:1.55}
ul.list li:before{content:"";position:absolute;inset-inline-start:0;top:.6em;width:5px;height:5px;background:var(--accent)}
ul.list.check li:before{background:var(--teal)}

.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .num{font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .lbl{font-size:12px;line-height:1.45;color:var(--soft)}

.stepnum{
  font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.1em;
  border-top:2px solid var(--accent);padding-top:8px;display:block;margin-bottom:8px
}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;min-width:0;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
caption{caption-side:bottom;text-align:start;font-size:11.5px;color:var(--soft);padding-top:10px;line-height:1.5}
th{
  text-align:start;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--soft);padding:0 12px 8px;border-bottom:1.5px solid var(--ink);white-space:nowrap
}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--body);line-height:1.5}
td.key{color:var(--ink);font-weight:600;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hl td{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}

/* ---------- pricing ---------- */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
.tier{border:1px solid var(--line);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.tier.rec{border:1.5px solid var(--accent);background:#fdfbf7}
.tier .tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.tier.rec .tag{color:var(--accent)}
.tier .name{font-size:19px;font-weight:600;color:var(--ink)}
.tier .price{font-size:26px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15}
.tier .price small{display:block;font-size:12px;font-weight:400;color:var(--soft);margin-top:4px;letter-spacing:0}
.tier ul{margin-top:2px}
.tier ul li{font-size:12.5px}

/* Pricing carries the most copy of any slide; tighten it so it never overflows */
section[data-key="pricing"]{gap:14px}
section[data-key="pricing"] .tier{gap:9px}
section[data-key="pricing"] .tier .note{font-size:11px}
section[data-key="pricing"] .panel{padding:14px 16px}

/* ---------- charts ---------- */
figure{margin:0}
.chart{width:100%;min-width:0;max-width:100%;direction:ltr}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);fill:var(--body)}
.ax-line{stroke:var(--line);stroke-width:1}
.ax-base{stroke:var(--rule);stroke-width:1.2}
.ax-lbl{font-size:11px;fill:var(--soft)}
.row-lbl{font-size:12.5px;fill:var(--ink)}
.row-lbl.us{font-weight:700}
.val-lbl{font-size:11.5px;fill:var(--body);font-weight:600}
.bar-a{fill:#b9bfc7}
.bar-b{fill:#dcd8d0}
.bar-us-a{fill:var(--teal)}
.bar-us-b{fill:var(--accent)}
figcaption{font-size:11px;color:var(--soft);line-height:1.5;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.legend{display:flex;gap:18px;font-size:11.5px;color:var(--soft);margin-bottom:6px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;display:inline-block}

/* ---------- brand lockup ---------- */
.brandmark{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.brandmark img{width:44px;height:44px;border-radius:6px;display:block;flex:0 0 auto}
.brandmark .bm-txt{display:flex;flex-direction:column;line-height:1.25}
.brandmark .bm-name{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.01em}
.brandmark .bm-role{font-size:11px;color:var(--soft)}
.contactcard{display:flex;align-items:flex-start;gap:12px}
.contactcard img{width:52px;height:52px;border-radius:6px;display:block;flex:0 0 auto}
.contactcard a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft);word-break:break-all}
.contactcard a:hover{border-bottom-color:var(--accent)}
.swipehint{display:none;font-size:11px;color:var(--soft);margin-top:-6px}

/* ---------- cover ---------- */
.cover{justify-content:center;gap:0}
.cover .rulebar{width:64px;height:3px;background:var(--accent);margin-bottom:26px}
.cover h1{margin-bottom:18px}
.cover .lead{margin-bottom:34px}
.cover .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;border-top:1px solid var(--line);padding-top:24px;max-width:1000px}
.cover .from{margin-top:38px;font-size:12.5px;color:var(--soft);line-height:1.7}
.cover .from b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}

/* ---------- footer nav ---------- */
.bar{
  position:fixed;inset-inline:0;bottom:0;height:56px;z-index:20;
  background:rgba(255,255,255,.97);border-top:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;
  backdrop-filter:saturate(180%) blur(6px);
}
.bar .where{font-size:11.5px;color:var(--soft);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .ctrl{display:flex;align-items:center;gap:8px}
.ticks{display:flex;gap:4px;margin-inline-end:6px}
.tick{width:18px;height:3px;background:var(--line);border:0;padding:0;cursor:pointer;transition:background .15s}
.tick:hover{background:var(--rule)}
.tick.on{background:var(--accent)}
button{
  font:inherit;font-size:12.5px;background:var(--bg);color:var(--ink);
  border:1px solid var(--rule);border-radius:3px;padding:7px 13px;cursor:pointer;
}
button:hover{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.primary:hover{background:#000}
button.lang{font-weight:700;min-width:76px;border-color:var(--accent);color:var(--accent)}
button.lang:hover{background:var(--accent-soft)}

/* ---------- responsive ---------- */
@media (min-width:1200px) and (min-height:760px){
  body{font-size:15.5px}
  table{font-size:14px}
  td{padding:14px}
  th{padding:0 14px 10px}
  ul.list li{font-size:14.5px}
  .panel{padding:22px 24px}
  .tier{padding:24px}
}
@media (max-width:1080px){
  :root{--pad:36px}
  .split{grid-template-columns:1fr;gap:18px}
  .g4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:780px){
  :root{--pad:20px}
  body{font-size:15px}
  .deck{scroll-snap-type:none;height:auto;min-height:100vh;padding-bottom:96px}
  .slide{min-height:auto;padding-bottom:34px;gap:18px}
  .g2,.g3,.g4,.tiers,.cover .facts{grid-template-columns:1fr}
  .split{gap:16px}
  .cover .facts{gap:18px}
  .cover .from{margin-top:26px}
  h1{font-size:26px;max-width:none}
  h2{font-size:20px;max-width:none}
  .lead{font-size:15.5px}
  ul.list li{font-size:14.5px}
  .kpi .num{font-size:26px}
  .eyebrow:after{max-width:60px}
  .panel{padding:15px 16px}
  .tier{padding:17px}

  /* keep charts and tables legible: scroll them, never squeeze them */
  .chart{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .chart svg{min-width:600px}
  .tablewrap{-webkit-overflow-scrolling:touch}
  .chart::-webkit-scrollbar,.tablewrap::-webkit-scrollbar{height:5px}
  .chart::-webkit-scrollbar-thumb,.tablewrap::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
  .swipehint{display:block}

  /* footer nav: thumb-sized targets, always visible */
  .bar{height:auto;padding:7px 10px calc(7px + env(safe-area-inset-bottom));flex-wrap:wrap;gap:7px}
  .bar .where{flex-basis:100%;order:2;text-align:center;font-size:11px}
  .bar .ctrl{order:1;flex:1;justify-content:space-between;gap:6px}
  .ticks{display:none}
  .bar button{min-height:44px;padding:0 12px;font-size:13px;flex:1}
  button.lang{min-width:0;flex:0 0 auto;padding:0 14px}
  #printBtn{display:none}
}
@media (max-width:380px){
  .bar button{padding:0 8px;font-size:12.5px}
}

/* ---------- print ---------- */
@page{size:A4 landscape;margin:11mm}
@media print{
  html,body{background:#fff}
  body{font-size:10.5pt;line-height:1.45}
  .deck{height:auto;overflow:visible;padding:0;scroll-snap-type:none}
  .bar{display:none!important}
  .slide{
    min-height:0;height:auto;border:0;padding:0 0 4mm;gap:11px;
    break-after:page;page-break-after:always;break-inside:avoid;
  }
  .slide:last-child{break-after:auto;page-break-after:auto}
  .cover{justify-content:flex-start;padding-top:14mm}
  h1{font-size:26pt}
  h2{font-size:16pt}
  .lead{font-size:11.5pt}
  .kpi .num{font-size:19pt}
  .tier .price{font-size:16pt}
  table{font-size:8.6pt;min-width:0}
  th{font-size:7.4pt;padding:0 7px 5px}
  td{padding:5px 7px}
  ul.list li{font-size:9.4pt;gap:6px}
  .tier ul li{font-size:8.6pt}
  .panel{padding:10px 12px;background:#f7f5f1!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .panel.mark,.tier.rec{background:#f5eee1!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .panel.teal{background:#e6eef0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .chart{overflow:visible!important}
  .chart svg{max-height:78mm;min-width:0!important}
  .tablewrap{overflow:visible!important}
  .swipehint{display:none!important}
  figcaption,caption,.note{font-size:7.6pt}
  .eyebrow{font-size:7.6pt}
  a{color:inherit;text-decoration:none}
}
</style>
</head>

        <!-- row 1 Le Meridien -->

        <text class="row-lbl" x="178" y="230" text-anchor="end" data-i18n="s2.r4"></text>
        <rect class="bar-a" x="190" y="220" width="341" height="13"/>
        <text class="val-lbl" x="539" y="231">8.2</text>
        <rect class="bar-b" x="190" y="237" width="199" height="13"/>

/* ---------- i18n ---------- */
var STORE_KEY = "concorde_offer_lang";
var lang = "ar";
try { var saved = localStorage.getItem(STORE_KEY); if (saved === "ar" || saved === "en") lang = saved; } catch (e) {}

var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
var deck = document.getElementById("deck");
var whereEl = document.getElementById("where");
var ticksEl = document.getElementById("ticks");
var langBtn = document.getElementById("langBtn");
var current = 0;

function t(key) {
  var dict = I18N[lang];
  if (dict && Object.prototype.hasOwnProperty.call(dict, key)) return dict[key];
  return "[" + key + "]";
}

function applyLang() {
  var root = document.documentElement;
  root.setAttribute("lang", lang);
  root.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
  document.title = t("doc.title");
  var nodes = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < nodes.length; i++) {
    var el = nodes[i];
    var key = el.getAttribute("data-i18n");
    var value = t(key);
    // Preserve element children that are themselves translated (e.g. price <small>)
    var childHolder = el.querySelector("[data-i18n]");
    if (childHolder) {
      var first = el.firstChild;
      if (first && first.nodeType === 3) first.nodeValue = value;
      else el.insertBefore(document.createTextNode(value), el.firstChild);
    } else {
      el.textContent = value;
    }
  }
  updateWhere();
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem(STORE_KEY, lang); } catch (e) {}
  applyLang();
}

/* ---------- navigation ---------- */
function slideName(i) { return t("nav." + slides[i].getAttribute("data-key")); }

function updateWhere() {
  whereEl.textContent = t("ui.where")
    .replace("{n}", String(current + 1))
    .replace("{t}", String(slides.length))
    .replace("{name}", slideName(current));
  for (var i = 0; i < ticksEl.children.length; i++) {
    ticksEl.children[i].className = "tick" + (i === current ? " on" : "");
    ticksEl.children[i].setAttribute("aria-label", slideName(i));
  }
}

function goTo(n) {
  if (n < 0) n = 0;
  if (n > slides.length - 1) n = slides.length - 1;
  current = n;
  slides[n].scrollIntoView({ behavior: "smooth", block: "start" });
  updateWhere();
}

for (var s = 0; s < slides.length; s++) {
  (function (idx) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tick";
    b.onclick = function () { goTo(idx); };
    ticksEl.appendChild(b);
  })(s);
}

var scrollTimer = null;
deck.addEventListener("scroll", function () {
  if (scrollTimer) clearTimeout(scrollTimer);
  scrollTimer = setTimeout(function () {
    var mid = deck.scrollTop + deck.clientHeight / 2;
    var best = 0;
    for (var i = 0; i < slides.length; i++) {
      if (slides[i].offsetTop <= mid) best = i;
    }
    if (best !== current) { current = best; updateWhere(); }
  }, 90);
});

langBtn.onclick = function () { setLang(lang === "ar" ? "en" : "ar"); };
document.getElementById("prevBtn").onclick = function () { goTo(current - 1); };
document.getElementById("nextBtn").onclick = function () { goTo(current + 1); };
document.getElementById("printBtn").onclick = function () { window.print(); };

document.addEventListener("keydown", function (e) {
  var tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  var rtl = lang === "ar";
  if (e.key === "ArrowRight") { e.preventDefault(); goTo(rtl ? current - 1 : current + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); goTo(rtl ? current + 1 : current - 1); }
  else if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); goTo(current + 1); }
  else if (e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); goTo(current - 1); }
  else if (e.key === "Home") { e.preventDefault(); goTo(0); }
  else if (e.key === "End") { e.preventDefault(); goTo(slides.length - 1); }
  else if (e.key === "l" || e.key === "L") { e.preventDefault(); setLang(lang === "ar" ? "en" : "ar"); }
});

/* ---------- touch navigation ---------- */
(function () {
  var x0 = null, y0 = null, t0 = 0, locked = false;

  // A swipe that begins inside a horizontally scrollable box (table, chart)
  // belongs to that box, not to slide navigation.
  function inScroller(node) {
    while (node && node !== deck) {
      if (node.scrollWidth - node.clientWidth > 4) {
        var ov = getComputedStyle(node).overflowX;
        if (ov === "auto" || ov === "scroll") return true;
      }
      node = node.parentElement;
    }
    return false;
  }

  deck.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) { x0 = null; return; }
    locked = inScroller(e.target);
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    t0 = Date.now();
  }, { passive: true });

  deck.addEventListener("touchend", function (e) {
    if (x0 === null || locked) { x0 = null; return; }
    var touch = e.changedTouches[0];
    var dx = touch.clientX - x0;
    var dy = touch.clientY - y0;
    var dt = Date.now() - t0;
    x0 = null;
    if (dt > 700) return;                                  // slow drag, not a swipe
    if (Math.abs(dx) < 55) return;                          // too short
    if (Math.abs(dx) < Math.abs(dy) * 1.5) return;          // mostly vertical: let it scroll
    var forward = (document.documentElement.dir === "rtl") ? dx > 0 : dx < 0;
    goTo(forward ? current + 1 : current - 1);
  }, { passive: true });
})();

/* ---------- translation completeness audit ---------- */
function i18nAudit() {
  var arKeys = Object.keys(I18N.ar);
  var enKeys = Object.keys(I18N.en);
  var missingEn = arKeys.filter(function (k) { return enKeys.indexOf(k) === -1; });
  var missingAr = enKeys.filter(function (k) { return arKeys.indexOf(k) === -1; });
  var used = [];
  var nodes = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < nodes.length; i++) {
    var k = nodes[i].getAttribute("data-i18n");
    if (used.indexOf(k) === -1) used.push(k);
  }
  var unresolved = used.filter(function (k) { return arKeys.indexOf(k) === -1 || enKeys.indexOf(k) === -1; });
  var identical = arKeys.filter(function (k) {
    return enKeys.indexOf(k) !== -1 && I18N.ar[k] === I18N.en[k];
  });
  var report = {
    arKeyCount: arKeys.length,
    enKeyCount: enKeys.length,
    domKeyCount: used.length,
    missingInEnglish: missingEn,
    missingInArabic: missingAr,
    unresolvedInDom: unresolved,
    identicalStrings: identical,
    ok: missingEn.length === 0 && missingAr.length === 0 && unresolved.length === 0
  };
  if (!report.ok && window.console) console.error("i18n audit failed", report);
  return report;
}
window.__i18nAudit = i18nAudit;

applyLang();
goTo(0);
i18nAudit();
